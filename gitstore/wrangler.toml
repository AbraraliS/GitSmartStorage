name = "gitstore-cdn-worker"
main = "worker/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npx tsc worker/index.ts --outDir worker/dist --module commonjs --target es2020 --esModuleInterop"

